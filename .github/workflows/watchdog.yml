name: Watchdog

# Checks UpSignal from outside its server. A failed run means it is down or
# stuck, and GitHub emails whoever last edited this file. Public repositories
# run Actions for free; this one holds no secrets.
on:
  schedule:
    - cron: '*/5 * * * *' # GitHub may start runs late or skip one
    - cron: '43 4 1 * *' # monthly: keep the schedule from being disabled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    name: System health
    if: github.event.schedule != '43 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://api.upsignal.cloud/v1/system-health' }}
    steps:
      - name: Check system health
        shell: bash
        run: |
          set -uo pipefail
          # Three tries a minute apart, so one slow moment or a deploy does
          # not send an alert.
          for attempt in 1 2 3; do
            body=$(curl --silent --show-error --max-time 20 \
              --write-out '\n%{http_code}' "$HEALTH_URL" 2>&1)
            status=${body##*$'\n'}
            body=${body%$'\n'*}
            if [[ "$status" == 200 ]]; then
              echo "Healthy: $body"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status $body"
            [[ "$attempt" == 3 ]] || sleep 60
          done
          echo "::error title=UpSignal is down::$HEALTH_URL answered HTTP $status: $body"
          exit 1

  # GitHub disables schedules in public repositories after 60 days without
  # activity. Re-enabling the workflow every month keeps it running.
  keepalive:
    name: Keep schedule enabled
    if: github.event.schedule == '43 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/watchdog.yml/enable"
